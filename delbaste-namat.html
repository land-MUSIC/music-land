<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


import {
getDatabase,
ref,
push,
onValue
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";



const firebaseConfig = {

apiKey: "AIzaSyAY-zwzfne1aggVQ25zbDhyrBFZPsYInUc",

authDomain: "musicland-5628a.firebaseapp.com",

databaseURL: "https://musicland-5628a-default-rtdb.firebaseio.com",

projectId: "musicland-5628a",

storageBucket: "musicland-5628a.firebasestorage.app",

messagingSenderId: "684294755825",

appId: "1:684294755825:web:61c0350aca2d5da53fa050"

};



const app = initializeApp(firebaseConfig);


const db = getDatabase(app);



const commentsRef = ref(
db,
"comments/delbaste-namat"
);



document.getElementById("sendComment").onclick = ()=>{


let name =
document.getElementById("commentName").value;


let text =
document.getElementById("commentText").value;



if(name && text){


push(commentsRef,{

name:name,

text:text,

time:Date.now()

});


document.getElementById("commentName").value="";

document.getElementById("commentText").value="";

}


};



onValue(commentsRef,(snapshot)=>{


const list =
document.getElementById("commentsList");


list.innerHTML="";



snapshot.forEach((item)=>{

let data=item.val();

list.innerHTML += `

<div class="comment">

<b>${data.name}</b>

<br>

${data.text.replace(/</g,"&lt;")}

</div>

`;

});

});


</script>
