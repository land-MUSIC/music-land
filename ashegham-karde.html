<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>دانلود آهنگ عاشقم کرده | موزیک لند</title>

<meta name="description" content="دانلود و پخش آنلاین آهنگ عاشقم کرده در موزیک لند.">

<style>

:root{
--bg:#0b1020;
--card:#151d35;
--purple:#8b5cf6;
--pink:#ec4899;
--muted:#aab3ca;
}

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Tahoma,Arial,sans-serif;
color:white;
background:
radial-gradient(circle at top right,rgba(139,92,246,.25),transparent 35%),
var(--bg);
min-height:100vh;
}

header{
padding:18px 6%;
background:rgba(11,16,32,.85);
border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
font-size:25px;
font-weight:bold;
}

main{
max-width:1000px;
margin:auto;
padding:40px 20px 120px;
}

.song-page{
background:linear-gradient(145deg,#151d35,#10172b);
border-radius:22px;
padding:30px;
text-align:center;
}

.cover{
width:100%;
max-width:500px;
height:320px;
margin:auto;
border-radius:18px;
overflow:hidden;
background:#080d1a;
}

.cover img{
width:100%;
height:100%;
object-fit:contain;
}

h1{
margin:28px 0 10px;
}

.artist{
color:var(--muted);
font-size:18px;
}

audio{
width:100%;
margin:20px 0;
}

.download-btn{
display:inline-block;
padding:14px 28px;
border-radius:12px;
background:linear-gradient(135deg,var(--purple),var(--pink));
color:white;
text-decoration:none;
font-weight:bold;
}

.description{
margin-top:35px;
color:var(--muted);
line-height:2;
text-align:right;
}

.back{
color:white;
display:inline-block;
margin-top:25px;
}
.comments{
max-width:1000px;
margin:30px auto;
background:var(--card);
padding:25px;
border-radius:20px;
}

.comments input,
.comments textarea{
width:100%;
padding:12px;
margin:10px 0;
background:#0b1020;
color:white;
border:0;
border-radius:10px;
}

.comments textarea{
height:100px;
}

.comments button{
background:#8b5cf6;
color:white;
border:0;
padding:12px 25px;
border-radius:20px;
cursor:pointer;
}

.comment{
margin-top:15px;
padding:15px;
background:#1c2745;
border-radius:12px;
}
</style>

</head>


<body>


<header>

<div class="logo">
🎵 موزیک‌لند
</div>

</header>


<main>

<div class="song-page">


<div class="cover">

<img src="ashegham-karde.jpg" alt="عاشقم کرده">

</div>


<h1>
دانلود آهنگ عاشقم کرده
</h1>


<div class="artist">
آهنگ عاشقم کرده
</div>


<audio controls>

<source src="ashegham-karde.mp3" type="audio/mpeg">

</audio>


<a class="download-btn" href="ashegham-karde.mp3" download>

⬇ دانلود آهنگ عاشقم کرده

</a>


<div class="description">

<h2>
آهنگ عاشقم کرده
</h2>

<p>
آهنگ عاشقم کرده را در موزیک لند آنلاین گوش دهید و دانلود کنید.
</p>

</div>


<a class="back" href="index.html">
← بازگشت به موزیک لند
</a>


</div>


</main>
<!-- بخش کامنت ها -->

<div class="comments">

<p style="color:#aab3ca; font-size:14px;">
⚠️ برای ارسال کامنت، لطفاً با VPN وارد شوید.
</p>
  
<h2>💬 نظرات کاربران</h2>

<input id="commentName" placeholder="نام شما">


<textarea id="commentText" placeholder="نظر خود را بنویسید"></textarea>


<button id="sendComment">
ارسال نظر
</button>


<div id="commentsList"></div>


</div>



<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


import {
getDatabase,
ref,
push,
onValue
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";



const firebaseConfig = {

apiKey: "AIzaSyAY-zwzfne1aggVQ25zbDhyrBFZPsYInUc",

authDomain: "musicland-5628a.firebaseapp.com",

databaseURL: "https://musicland-5628a-default-rtdb.firebaseio.com",

projectId: "musicland-5628a",

storageBucket: "musicland-5628a.firebasestorage.app",

messagingSenderId: "684294755825",

appId: "1:684294755825:web:61c0350aca2d5da53fa050"

};



const app = initializeApp(firebaseConfig);


const db = getDatabase(app);



console.log("ashegham-karde comments connected ✅");



const commentsRef = ref(
db,
"comments/ashegham-karde"
);



document
.getElementById("sendComment")
.onclick = ()=>{


let name =
document.getElementById("commentName").value;


let text =
document.getElementById("commentText").value;



if(name && text){


push(commentsRef,{

name:name,

text:text,

time:Date.now()

});


document.getElementById("commentName").value="";

document.getElementById("commentText").value="";


}

};



onValue(commentsRef,(snapshot)=>{


const list =
document.getElementById("commentsList");


list.innerHTML="";



snapshot.forEach((item)=>{


let data=item.val();



list.innerHTML += `

<div class="comment">

<b>${data.name}</b>

<br>

${data.text}

</div>

`;


});


});



</script>


</body>

</html>
