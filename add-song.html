<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta charset="UTF-8">
<title>ساخت صفحه آهنگ | موزیک لند</title>

<style>

body{
background:#0b1020;
color:white;
font-family:tahoma;
padding:30px;
}

input,button{
width:100%;
padding:12px;
margin:10px 0;
border-radius:10px;
border:0;
}

button{
background:#8b5cf6;
color:white;
font-size:18px;
cursor:pointer;
}

textarea{
width:100%;
height:300px;
background:#151d35;
color:white;
padding:15px;
}

</style>

</head>

<body>


<h1>🎵 ساخت صفحه آهنگ</h1>


<input id="name" placeholder="اسم آهنگ">

<input id="artist" placeholder="خواننده">

<input id="mp3" placeholder="اسم فایل mp3 مثلا saman-lajbaz.mp3">

<input id="cover" placeholder="اسم کاور مثلا Saman-Jalili-Lajbaz.jpg">


<button onclick="make()">ساخت کد</button>


<textarea id="output"></textarea>


<script>

function make(){


let name=document.getElementById("name").value;

let artist=document.getElementById("artist").value;

let mp3=document.getElementById("mp3").value;

let cover=document.getElementById("cover").value;



let code=`

<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<title>${name} | موزیک لند</title>

</head>


<body>


<h1>دانلود آهنگ ${name}</h1>

<img src="${cover}" width="300">


<h3>${artist}</h3>


<audio controls>

<source src="${mp3}" type="audio/mpeg">

</audio>


<br><br>


<a href="${mp3}" download>
⬇ دانلود آهنگ
</a>


<br><br>


<a href="index.html">
بازگشت به موزیک لند
</a>


</body>

</html>

`;


document.getElementById("output").value=code;


}


</script>


</body>
</html>
